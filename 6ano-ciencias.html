<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice Ciências 6º Ano - Promover</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- VARIÁVEIS DE TEMA --- */
        :root {
            --bg-color: #F8F9FA;
            --text-color: #2D3748;
            --border-color: #000000;
            --white: #FFFFFF;

            /* Cores das Categorias - Ciências 6º Ano */
            --color-bio: #2E8B57; /* Verde - Biologia/Vida */
            --bg-bio: #C1E1C1;
            
            /* Deixei algumas cores extras preparadas para os próximos sumários */
            --color-terra: #8D6E63; /* Marrom - Terra/Universo */
            --bg-terra: #D7CCC8;
            
            --color-fisqui: #0288D1; /* Azul - Matéria/Energia */
            --bg-fisqui: #B3E5FC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .logo-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            padding: 30px 0 20px 0; 
        }
        .logo-img {
            max-height: 130px; 
            width: auto;
            display: block;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            font-weight: 900;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        /* --- BARRA DE PESQUISA --- */
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            background-color: var(--white);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
            box-shadow: 4px 4px 0px var(--border-color);
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0.6;
        }

        /* --- BADGES DE CATEGORIA --- */
        .category-header {
            display: flex;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .badge {
            padding: 8px 16px;
            color: white;
            font-weight: 700;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }
        .badge-bio { background-color: var(--color-bio); }
        .badge-terra { background-color: var(--color-terra); }
        .badge-fisqui { background-color: var(--color-fisqui); }

        /* --- ITENS DOS TÓPICOS (COM CHECKBOX E LINK) --- */
        .topic-item {
            display: flex;
            align-items: stretch;
            background-color: var(--white);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 4px 4px 0px var(--border-color);
            position: relative;
            overflow: hidden;
            transition: all 0.1s ease;
        }

        .topic-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-color);
            background-color: #FAFAFA;
        }

        .topic-item:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        /* Borda Lateral Colorida */
        .topic-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 10px;
            border-right: 2px solid var(--border-color);
            z-index: 1;
        }

        /* Checkbox Area */
        .topic-cb-wrapper {
            display: flex;
            align-items: center;
            padding: 0 0 0 24px;
            z-index: 2;
        }
        .topic-cb {
            width: 22px;
            height: 22px;
            cursor: pointer;
            border: 2px solid var(--border-color);
            border-radius: 4px;
        }

        /* Área do Link Clicável */
        .topic-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            padding: 16px 20px 16px 12px;
            flex-grow: 1;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 2;
        }

        /* Agrupamento do Número + Título */
        .topic-info {
            display: flex;
            align-items: center;
        }

        /* Caixa estilosa do número */
        .topic-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            color: var(--white);
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: 8px;
            margin-right: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        /* Cores das laterais, checkboxes e números por categoria */
        .item-bio::before { background-color: var(--bg-bio); }
        .item-bio .topic-cb { accent-color: var(--color-bio); }
        .item-bio .topic-number { background-color: var(--color-bio); }

        .item-terra::before { background-color: var(--bg-terra); }
        .item-terra .topic-cb { accent-color: var(--color-terra); }
        .item-terra .topic-number { background-color: var(--color-terra); }

        .item-fisqui::before { background-color: var(--bg-fisqui); }
        .item-fisqui .topic-cb { accent-color: var(--color-fisqui); }
        .item-fisqui .topic-number { background-color: var(--color-fisqui); }

        .arrow { font-weight: 900; color: #CBD5E0; }
        .topic-item:hover .arrow { color: var(--text-color); }

        /* Mensagem de Não Encontrado */
        #no-results {
            text-align: center;
            color: #888;
            margin-top: 30px;
            font-weight: 600;
            display: none;
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="logo-header">
        <img src="logo.png" alt="Logo Promover" class="logo-img">
    </div>

    <div class="container">
        <h1>Ciências 6º Ano</h1>
        <p class="subtitle">Acompanhe seu progresso nos estudos</p>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar qualquer conteúdo...">
        </div>

        <!-- MÓDULO 1: VIDA E EVOLUÇÃO (Exemplo de Categoria) -->
        <div class="content-group">
            <div class="category-header"><span class="badge badge-bio">🌿 Vida e Evolução</span></div>
            
            <div class="topic-item item-bio" data-id="cie6-estudo-biologia">
                <div class="topic-cb-wrapper">
                    <input type="checkbox" class="topic-cb">
                </div>
                <a href="estudo-biologia.html" class="topic-link">
                    <div class="topic-info">
                        <span class="topic-number">7</span>
                        <span class="topic-title">O estudo da Biologia</span>
                    </div>
                    <span class="arrow">➜</span>
                </a>
            </div>
            
            <!-- Os próximos sumários que você mandar entrarão aqui ou em novos módulos! -->
        </div>

        <div id="no-results">
            <p>😕 Nenhum tópico encontrado com esse nome.</p>
        </div>

    </div>

    <footer>
        © 2026 Promover Educação
    </footer>

    <script>
        // ----------------------------------------------------
        // SISTEMA DE PROGRESSO (SALVO NO DISPOSITIVO - LOCALSTORAGE)
        // ----------------------------------------------------
        // Chave exclusiva para Ciências 6º Ano
        const STORAGE_KEY = 'ciencias6_promover_progresso_2026';

        function getProgress() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveProgress(progressArray) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progressArray));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const progress = getProgress();
            
            progress.forEach(id => {
                const item = document.querySelector(`.topic-item[data-id="${id}"]`);
                if (item) {
                    const cb = item.querySelector('.topic-cb');
                    if (cb) cb.checked = true;
                }
            });
        });

        // Evento 1: Clicar no Checkbox
        document.querySelectorAll('.topic-cb').forEach(cb => {
            cb.addEventListener('change', function(e) {
                const item = this.closest('.topic-item');
                const id = item.getAttribute('data-id');
                let progress = getProgress();

                if (this.checked) {
                    if (!progress.includes(id)) progress.push(id);
                } else {
                    progress = progress.filter(item => item !== id);
                }
                saveProgress(progress);
            });
        });

        // Evento 2: Clicar no link (Marca automático)
        document.querySelectorAll('.topic-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const item = this.closest('.topic-item');
                const id = item.getAttribute('data-id');
                const cb = item.querySelector('.topic-cb');
                
                if (!cb.checked) {
                    cb.checked = true;
                    let progress = getProgress();
                    if (!progress.includes(id)) {
                        progress.push(id);
                        saveProgress(progress);
                    }
                }
            });
        });

        // ----------------------------------------------------
        // LÓGICA DE PESQUISA (Otimizada com remoção de acentos)
        // ----------------------------------------------------
        const searchInput = document.getElementById('searchInput');
        const contentGroups = document.querySelectorAll('.content-group');
        const noResultsMsg = document.getElementById('no-results');

        searchInput.addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const termNormalized = term.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let totalVisibleGroups = 0;

            contentGroups.forEach(group => {
                const items = group.querySelectorAll('.topic-item');
                let hasVisibleItem = false;

                items.forEach(item => {
                    const titleElement = item.querySelector('.topic-info');
                    const text = titleElement.textContent.toLowerCase();
                    const textNormalized = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    
                    if (textNormalized.includes(termNormalized)) {
                        item.style.display = 'flex'; 
                        hasVisibleItem = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                if (hasVisibleItem) {
                    group.style.display = 'block';
                    totalVisibleGroups++;
                } else {
                    group.style.display = 'none';
                }
            });

            if (totalVisibleGroups === 0) {
                noResultsMsg.style.display = 'block';
            } else {
                noResultsMsg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
